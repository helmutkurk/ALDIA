name: iOS archive and TestFlight

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Auto archives unsigned without secrets; a complete secret set uploads to TestFlight
        type: choice
        options: [auto, unsigned, testflight]
        default: auto
      api_base_url:
        description: HTTPS API URL (required for TestFlight; optional for unsigned check)
        type: string
      public_portal_url:
        description: HTTPS portal URL (required for TestFlight; optional for unsigned check)
        type: string

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Flutter 3.47.9
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Archive, optionally sign and upload
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          API_BASE_URL: ${{ inputs.api_base_url }}
          PUBLIC_PORTAL_URL: ${{ inputs.public_portal_url }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: bash scripts/ios_release.sh
      - name: Upload archive and optional IPA (never credentials)
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aldia-ios-${{ github.run_number }}
          path: |
            app/build/ios/aldia-archive.tar.gz
            app/build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: warn
